<!doctype html>
<html lang="zh-CN">
<head>

  <link rel="icon" type="image/png" href="assets/img/favicon.png">

<body data-page="achievements">
  <main>
    <section class="page-hero ach-hero">
      <div class="page-hero-word" aria-hidden="true">ACHIEVEMENTS</div>
      <div class="container">
        <div>
          <span class="eyebrow">Area 01 · 成就档案库</span>
          <h1>已解锁成就 <span class="ach-hero-pad" aria-hidden="true">🎮</span></h1>
          <p class="page-hero-lead">记录你的作品、项目成果和关键里程碑。</p>
          <span class="reference-label">参考案例 · 请替换</span>
        </div>
        <div class="ach-hero-mascot" aria-hidden="true">
          <img class="sticker" src="assets/img/sticker-queen.webp" alt="">
          <p class="ach-hero-bubble">收集更多成就<br>解锁更强的自己！</p>
        </div>
      </div>
    </section>

    <!-- 成就徽章墙：收藏图鉴风 -->
    <section class="section" style="padding-top:8px">
      <div class="container">
        <div class="badge-wall reveal">
          <span class="bw-tabs" aria-hidden="true"><i></i><i></i><i></i></span>
          <div class="bw-head">
            <img class="bw-head-icon" src="assets/img/badges/crown.png" alt="">
            <h2>成就徽章墙</h2>
            <span class="bw-head-en">Achievement Collection</span>
          </div>

          <div class="bw-grid" data-badge-wall>
            <div class="bw-more">
              <img src="assets/img/badges/more.png" alt="更多成就持续收集中，敬请期待！">
            </div>
          </div>

          <span class="bw-spark" style="left:36%; top:96px" aria-hidden="true">✦</span>
          <span class="bw-spark" style="right:31%; top:70px" aria-hidden="true">✦</span>
          <span class="bw-spark" style="left:33%; bottom:150px" aria-hidden="true">✦</span>
        </div>
      </div>
    </section>

    <!-- 作品收藏册 -->
    <section class="section" style="padding-top:24px">
      <div class="container">
        <div class="section-head">
          <div>
            <span class="eyebrow">Collection</span>
            <h2>代表作品收藏册</h2>
          </div>
          <div class="collection-note">
            <img class="sticker" src="assets/img/sticker-queen-wink.webp" alt="">
            <div><p>按需填写作品介绍、素材和成果。</p><span class="reference-label">参考案例 · 请替换</span></div>
          </div>
        </div>

        <nav class="works-nav" aria-label="作品分类" data-works-nav></nav>
        <div data-works-sections></div>
      </div>
    </section>
  </main>

  <script src="assets/js/main.js" defer></script>
  <script type="module" src="assets/js/works.js"></script>

</html>
